# .github/workflows/build-apk.yml

name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Android build variant"
        required: true
        default: "zcashmainnetStoreDebug"
        type: choice
        options:
          - zcashmainnetStoreDebug
          - zcashmainnetFossDebug
          - zcashtestnetStoreDebug
          - zcashtestnetFossDebug

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle and Java versions
        run: |
          java -version
          ./gradlew --version

      - name: Build APK
        run: |
          ./gradlew ":app:assemble${{ inputs.variant#?}}" --stacktrace
        env:
          ORG_GRADLE_PROJECT_ZCASH_VERSION_CODE: "1"
          ORG_GRADLE_PROJECT_ZCASH_VERSION_NAME: "3.9.3"
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_APP_NAME: "Zodl"
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_PACKAGE_NAME: "co.electriccoin.zcash"
          ORG_GRADLE_PROJECT_IS_MINIFY_ENABLED: "false"
          ORG_GRADLE_PROJECT_NDK_DEBUG_SYMBOL_LEVEL: "none"
          ORG_GRADLE_PROJECT_IS_RELEASE_BUILD_DEBUGGABLE: "false"
          ORG_GRADLE_PROJECT_IS_SIGN_RELEASE_BUILD_WITH_DEBUG_KEY: "false"
          ORG_GRADLE_PROJECT_IS_USE_TEST_ORCHESTRATOR: "false"
          ORG_GRADLE_PROJECT_IS_CRASH_ON_STRICT_MODE_VIOLATION: "false"
          ORG_GRADLE_PROJECT_IS_ENABLE_COMPOSE_COMPILER_METRICS: "false"
          ORG_GRADLE_PROJECT_IS_ENABLE_COMPOSE_COMPILER_REPORTS: "false"
          ORG_GRADLE_PROJECT_ZCASH_FLEXA_KEY: ""
          ORG_GRADLE_PROJECT_ZCASH_CMC_KEY: ""

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "${APK_PATH}" ]; then
            echo "No APK was produced."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "APK found: ${APK_PATH}"
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp "${{ steps.apk.outputs.path }}" \
            "artifacts/zodl-${{ inputs.variant }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zodl-${{ inputs.variant }}-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
