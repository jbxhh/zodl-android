name: Build My APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: ./gradlew assembleZcashmainnetFossDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-zh-apk
          path: app/build/outputs/apk/zcashmainnetFoss/debug/*.apk
